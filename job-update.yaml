properties:
  configuration:
    triggerType: Schedule
    scheduleTriggerConfig:
      cronExpression: "0 2 * * *"
      parallelism: 1
      replicaCompletionCount: 1
    replicaTimeout: 7200
    replicaRetryLimit: 2
    registries:
    - server: acraivmprod.azurecr.io
      username: acraivmprod
      passwordSecretRef: reg-pswd-e8080818-be1b
  template:
    containers:
    - name: aivm-reporting-job
      image: acraivmprod.azurecr.io/macaebackend:latest
      command:
      - /bin/sh
      args:
      - -c
      - python -m scripts.run_reporting_export --refresh-powerbi --json
      resources:
        cpu: 1.0
        memory: 2Gi
      env:
      - name: KEYVAULT_URI
        value: https://kv-aivm-core.vault.azure.net/
      - name: COSMOSDB_ENDPOINT
        value: https://cosmos-aivmprodcliu3.documents.azure.com:443/
      - name: COSMOSDB_DATABASE
        value: macae
      - name: AZURE_OPENAI_ENDPOINT
        value: https://aif-aivmprodcliu3.openai.azure.com/
      - name: AZURE_CLIENT_ID
        value: c6c2af5b-d1c9-4b02-9b8e-5894e89cb9cd
      - name: AZURE_MANAGED_IDENTITY_CLIENT_ID
        value: c6c2af5b-d1c9-4b02-9b8e-5894e89cb9cd
      - name: REPORTING_MANAGED_IDENTITY_CLIENT_ID
        value: c6c2af5b-d1c9-4b02-9b8e-5894e89cb9cd
      - name: PBI_WORKSPACE_ID
        value: 8f802077-e058-4aac-ae18-0335bbbf59ab
      - name: PBI_DATASET_ID
        value: acc0156b-8e36-474b-8324-5d1f32359fc9
      - name: PBI_CLIENT_ID
        value: 712006fa-1cbd-4f92-9fce-6f6a2ef23d42
      - name: PBI_CLIENT_SECRET
        value: <REPLACE_WITH_YOUR_POWERBI_CLIENT_SECRET>
      - name: STORAGE_ACCOUNT_NAME
        value: stgaivmreporting
      - name: STORAGE_CONTAINER_NAME
        value: aivm-reporting
      - name: AZURE_AI_SUBSCRIPTION_ID
        value: 66e84420-9ef4-4264-aedb-7beacbfe9e81
      - name: AZURE_AI_RESOURCE_GROUP
        value: RG-AIVM
      - name: AZURE_AI_PROJECT_NAME
        value: proj-aivmprodcliu3
      - name: AZURE_AI_AGENT_ENDPOINT
        value: https://aif-aivmprodcliu3.services.ai.azure.com/api/projects/proj-aivmprodcliu3
      - name: AZURE_OPENAI_DEPLOYMENT_NAME
        value: gpt-4o
      - name: AZURE_OPENAI_API_VERSION
        value: 2024-11-20
